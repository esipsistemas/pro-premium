<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📡 ESIP - Sistemas</title>

<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body {
    background: #1a0000;
    color: #fff;
    font-family: Arial, sans-serif;
    text-align: center;
    margin: 0;
    padding-bottom: 40px;
}
h2 { margin-top: 20px; }

#reader {
    width: 350px;
    margin: 20px auto;
    border: 4px solid #ff0000;
    border-radius: 12px;
}
.btn {
    background: #ff0000;
    color: white;
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    margin: 8px auto;
    width: 90%;
}
input{
    width:90%;
    padding:12px;
    border-radius:10px;
    border:none;
    font-size:16px;
    margin-top:8px
}

/* POPUP */
#msgPop {
    display:none;
    position: fixed;
    top: -60px;
    left: 50%;
    transform: translateX(-50%);
    padding: 12px 20px;
    background: #ff4444;
    color: #fff;
    border-radius: 12px;
    font-weight: bold;
    font-size: 16px;
    z-index: 9999;
    opacity: 0;
    transition: all 0.5s ease;
}
#msgPop.green { background: #00ff88; color: #003300; }
#msgPop.yellow { background: #ffaa00; color: #330000; }
#msgPop.show { top: 20px; opacity: 1; }

/* Histórico */
#history { margin-top: 20px; padding: 10px; }
.badge {
    display: inline-block;
    margin: 5px;
    padding: 8px 14px;
    border-radius: 30px;
    font-size: 14px;
    background: #330000;
    border: 1px solid #ff4444;
    color: #fff;
}
.badge.valid { background: #003314; border-color: #00ff88; }

#counters { margin-top: 10px; }
.counter-box {
    background: #330000;
    border: 2px solid #ff0000;
    padding: 8px 12px;
    border-radius: 10px;
    font-size: 15px;
    margin:4px;
    display:inline-block
}

.portaria-box{
    margin-top:10px;
    font-size:18px;
    font-weight:bold
}
</style>
</head>

<body>

<h2>📡 ESIP - Sistemas</h2>

<div class="portaria-box">
    🚪 Portaria: <span id="portariaAtual">A</span>
</div>

<div id="counters">
    <div class="counter-box">Válidos: <span id="countValid">0</span></div>
    <div class="counter-box">Usados: <span id="countUsed">0</span></div>
    <div class="counter-box">Inválidos: <span id="countInvalid">0</span></div>
    <div class="counter-box">🧠 Memória: <span id="countMemory">0</span></div>
</div>

<div id="reader"></div>

<button id="toggleLight" class="btn">🔦 Lanterna</button>
<button id="switchCam" class="btn">🔄 Trocar Câmera</button>
<button id="adminPortaria" class="btn">🔐 Trocar Portaria</button>

<input id="searchInput" placeholder="🔍 Buscar por ID">
<button id="searchBtn" class="btn">🔎 Buscar por ID</button>

<button id="reset" class="btn">🗑️ Resetar Ingressos</button>
<button id="export" class="btn">📤 Exportar CSV</button>
<button id="exportPDF" class="btn">📄 Exportar PDF</button>

<!-- ===== CAMPOS DO PDF ===== -->
<h3>⚙️ Configuração do PDF</h3>
<input id="pdfTitle" placeholder="📄 Título do relatório">
<input id="pdfFileName" placeholder="💾 Nome do arquivo PDF (sem .pdf)">
<input type="file" id="pdfLogo" accept="image/*">

<div id="msgPop"></div>

<h3>📜 Histórico</h3>
<div id="history"></div>

<script>
const STORAGE_USED_KEY = "usedCodesMap_v1";
const STORAGE_PORTARIA = "portariaAtual";
const STORAGE_COUNT_VALID = "countValid";
const STORAGE_COUNT_USED = "countUsed";
const STORAGE_COUNT_INVALID = "countInvalid";
const RESET_PASSWORD = "ESIP2025";

const sValid   = new Audio("https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg");
const sInvalid = new Audio("https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg");
const sWarning = new Audio("https://actions.google.com/sounds/v1/cartoon/pop.ogg");

let html5Qr, flashOn = true, scanning = true;
let currentCam = 0, cameras = [];
let usedMap = {}, lastCode = "", lastTime = 0;
let pdfLogoBase64 = null;

let portaria = localStorage.getItem(STORAGE_PORTARIA) || "A";
document.getElementById("portariaAtual").textContent = portaria;

function loadUsedMap(){
    usedMap = JSON.parse(localStorage.getItem(STORAGE_USED_KEY) || "{}");
}
function saveUsedMap(){
    localStorage.setItem(STORAGE_USED_KEY, JSON.stringify(usedMap));
    document.getElementById("countMemory").textContent = Object.keys(usedMap).length;
}
loadUsedMap();

let totalValid   = parseInt(localStorage.getItem(STORAGE_COUNT_VALID) || "0");
let totalUsed    = parseInt(localStorage.getItem(STORAGE_COUNT_USED) || "0");
let totalInvalid = parseInt(localStorage.getItem(STORAGE_COUNT_INVALID) || "0");

function saveCounts(){
    localStorage.setItem(STORAGE_COUNT_VALID, totalValid);
    localStorage.setItem(STORAGE_COUNT_USED, totalUsed);
    localStorage.setItem(STORAGE_COUNT_INVALID, totalInvalid);
}

function updateCounters(){
    countValid.textContent = totalValid;
    countUsed.textContent = totalUsed;
    countInvalid.textContent = totalInvalid;
    countMemory.textContent = Object.keys(usedMap).length;
}
updateCounters();

function showPopup(txt, ok){
    const m = msgPop;
    m.textContent = txt;
    m.className = ok===true ? "green show" : ok===false ? "show" : "yellow show";
    m.style.display="block";
    setTimeout(()=>{ m.className=""; m.style.display="none"; },2500);
}

function validateCode(code){
    if(!code.startsWith("ID: ")) return false;
    return code.replace("ID: ","").split("-INGR-")[0] === portaria;
}

function processQR(code){
    if(!scanning) return;
    scanning=false;
    const now = Date.now();

    if(code===lastCode && now-lastTime<3000){ scanning=true; return; }
    lastCode=code; lastTime=now;

    if(!validateCode(code)){
        totalInvalid++; showPopup("❌ QR inválido",false);
    }else if(!usedMap[code]){
        usedMap[code]=now; totalValid++; showPopup("✅ Válido",true);
    }else{
        totalUsed++; showPopup("⚠️ Já usado","aviso");
    }
    saveUsedMap(); saveCounts(); updateCounters();
    setTimeout(()=>scanning=true,600);
}

async function startScanner(){
    html5Qr = new Html5Qrcode("reader");
    cameras = await Html5Qrcode.getCameras();
    await html5Qr.start(cameras[0].id,{fps:10,qrbox:250},processQR);
}
startScanner();

/* LOGO */
pdfLogo.onchange = e=>{
    const r = new FileReader();
    r.onload = ()=>{ pdfLogoBase64=r.result; showPopup("🖼️ Logo carregado",true); };
    r.readAsDataURL(e.target.files[0]);
};

/* EXPORT PDF */
exportPDF.onclick = ()=>{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    const titulo = pdfTitle.value || "Relatório ESIP";
    const nome = pdfFileName.value || "relatorio";
    let y=15;

    if(pdfLogoBase64){
        doc.addImage(pdfLogoBase64,"PNG",10,y,30,30);
        doc.text(titulo,50,y+15);
        y+=35;
    }else{
        doc.text(titulo,10,y); y+=15;
    }

    doc.text(`Portaria: ${portaria}`,10,y); y+=7;
    doc.text(`Válidos: ${totalValid}`,10,y); y+=7;
    doc.text(`Usados: ${totalUsed}`,10,y); y+=7;
    doc.text(`Inválidos: ${totalInvalid}`,10,y); y+=10;

    for(const [c,t] of Object.entries(usedMap)){
        doc.text(`${c} - ${new Date(t).toLocaleString()}`,10,y);
        y+=7;
        if(y>280){ doc.addPage(); y=15; }
    }
    doc.save(`${nome}.pdf`);
};
</script>

</body>
</html>
