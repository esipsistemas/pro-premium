<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📡 ESIP - Sistemas</title>

<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body {
    background: #1a0000;
    color: #fff;
    font-family: Arial, sans-serif;
    text-align: center;
    margin: 0;
    padding-bottom: 40px;
}
h2 { margin-top: 20px; }

#reader {
    width: 350px;
    margin: 20px auto;
    border: 4px solid #ff0000;
    border-radius: 12px;
}
.btn {
    background: #ff0000;
    color: white;
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    margin: 8px auto;
    width: 90%;
}
input{
    width:90%;
    padding:12px;
    border-radius:10px;
    border:none;
    font-size:16px;
    margin-top:8px
}

#msgPop {
    display:none;
    position: fixed;
    top: -60px;
    left: 50%;
    transform: translateX(-50%);
    padding: 12px 20px;
    background: #ff4444;
    color: #fff;
    border-radius: 12px;
    font-weight: bold;
    font-size: 16px;
    z-index: 9999;
    opacity: 0;
    transition: all 0.5s ease;
}
#msgPop.green { background: #00ff88; color: #003300; }
#msgPop.yellow { background: #ffaa00; color: #330000; }

#msgPop.show { top: 20px; opacity: 1; }

#history { margin-top: 20px; padding: 10px; }
.badge {
    display: inline-block;
    margin: 5px;
    padding: 8px 14px;
    border-radius: 30px;
    font-size: 14px;
    background: #330000;
    border: 1px solid #ff4444;
    color: #fff;
}
.badge.valid { background: #003314; border-color: #00ff88; }

#counters { margin-top: 10px; }
.counter-box {
    background: #330000;
    border: 2px solid #ff0000;
    padding: 8px 12px;
    border-radius: 10px;
    font-size: 15px;
    margin:4px;
    display:inline-block
}
.portaria-box{
    margin-top:10px;
    font-size:18px;
    font-weight:bold
}
</style>
</head>

<body>

<h2>📡 ESIP - Sistemas</h2>

<!-- 🔧 NOVOS CAMPOS -->
<input type="file" id="logoInput" accept="image/*">
<input id="tituloPDF" placeholder="🏷️ Título do PDF (letras grandes)">
<input id="nomePDF" placeholder="📝 Nome do arquivo PDF (sem .pdf)">

<div class="portaria-box">
    🚪 Portaria: <span id="portariaAtual">A</span>
</div>

<div id="counters">
    <div class="counter-box">Válidos: <span id="countValid">0</span></div>
    <div class="counter-box">Usados: <span id="countUsed">0</span></div>
    <div class="counter-box">Inválidos: <span id="countInvalid">0</span></div>
    <div class="counter-box">🧠 Memória: <span id="countMemory">0</span></div>
</div>

<div id="reader"></div>

<button id="toggleLight" class="btn">🔦 Lanterna</button>
<button id="switchCam" class="btn">🔄 Trocar Câmera</button>
<button id="adminPortaria" class="btn">🔐 Trocar Portaria</button>

<input id="searchInput" placeholder="🔍 Buscar por ID">
<button id="searchBtn" class="btn">🔎 Buscar por ID</button>

<button id="reset" class="btn">🗑️ Resetar Ingressos</button>
<button id="export" class="btn">📤 Exportar CSV</button>
<button id="exportPDF" class="btn">📄 Exportar PDF</button>

<div id="msgPop"></div>

<h3>📜 Histórico</h3>
<div id="history"></div>

<script>
const STORAGE_USED_KEY = "usedCodesMap_v1";
const STORAGE_PORTARIA = "portariaAtual";
const RESET_PASSWORD = "ESIP2025";

let usedMap = {};
let logoBase64 = null;

/* ===== Logo ===== */
document.getElementById("logoInput").onchange = e=>{
    const file = e.target.files[0];
    if(!file) return;
    const r = new FileReader();
    r.onload = ()=> logoBase64 = r.result;
    r.readAsDataURL(file);
};

/* ===== Export PDF ===== */
document.getElementById("exportPDF").onclick = () => {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    let y = 15;

    if(logoBase64){
        doc.addImage(logoBase64,"PNG",80,5,50,25);
        y = 40;
    }

    const titulo = document.getElementById("tituloPDF").value || "Relatório ESIP";
    doc.setFontSize(20);
    doc.text(titulo,105,y,{align:"center"});
    y+=12;

    doc.setFontSize(12);
    doc.text(`Portaria: ${localStorage.getItem(STORAGE_PORTARIA) || "A"}`,10,y); y+=8;

    Object.entries(usedMap).forEach(([c,t])=>{
        doc.text(`${c} - ${new Date(t).toLocaleString()}`,10,y);
        y+=7;
        if(y>280){ doc.addPage(); y=10; }
    });

    const nome = document.getElementById("nomePDF").value || "ingressos";
    doc.save(nome + ".pdf");
};
</script>

</body>
</html>
